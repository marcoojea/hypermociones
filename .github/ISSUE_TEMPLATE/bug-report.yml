name: Error de la aplicación
description: Comunica un problema reproducible de Hypermociones
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Gracias por ayudar a mejorar Hypermociones. No incluyas claves ni datos personales.
  - type: textarea
    id: description
    attributes:
      label: Qué ha ocurrido
      description: Explica el resultado observado y el que esperabas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir…\n2. Pulsar…\n3. Comprobar…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 128 · Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He comprobado que el informe no contiene claves ni datos personales.
          required: true
