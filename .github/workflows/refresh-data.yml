name: Refresh official data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-official-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:fetch
      - run: npm run data:check
      - run: npm test
      - run: npm run typecheck
      - id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/generated/real-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/real-data.json
          git commit -m "chore(data): refresh official snapshot"
          git push
