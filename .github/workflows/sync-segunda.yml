name: Sync Segunda matches, injuries and news

# Runs the ESPN sync every 15 minutes and commits only when a data file changed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-segunda-espn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:espn-segunda
      - id: changes
        shell: bash
        run: |
          # Untracked files are not in `git diff`, so check status instead.
          if [ -n "$(git status --porcelain -- data/generated/espn-segunda-matches.json data/generated/espn-segunda-injuries.json data/generated/espn-segunda-news.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/espn-segunda-matches.json data/generated/espn-segunda-injuries.json data/generated/espn-segunda-news.json
          git commit -m "chore(data): sync Segunda matches, injuries and news"
          git pull --rebase --autostash
          git push
